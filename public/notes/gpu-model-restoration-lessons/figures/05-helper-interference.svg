<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">System-level interference from helper GPU relays</title><desc id="desc">Two conceptual scenarios show that a relay can use spare GPU resources or contend with inference on the helper.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.heading{font-size:20px;font-weight:700}.sub{font-size:13px;fill:#5b6c77}.label{font-size:13px;font-weight:600}.mini{font-size:11px;fill:#566775}.white{fill:white;font-weight:600;font-size:12px}.card{fill:#ffffff;stroke:#d6e2e9;stroke-width:1.2}.blue{fill:#4787b0}.bluelight{fill:#bbd9eb}.green{fill:#4b997e}.greenlight{fill:#cde7dc}.gold{fill:#eac175}.purple{fill:#9274bb}.purplelight{fill:#e7ddf3}.stroke{stroke:#8ba1b0;stroke-width:1.5}.dash{stroke:#607d92;stroke-width:1.5;stroke-dasharray:5 5}.timeline{stroke:#9fb1bc;stroke-width:2}
</style><rect width="900" height="360" rx="16" fill="#f8fbfd"/><text x="30" y="39" text-anchor="start" class="heading">System outcome depends on helper-GPU load</text><text x="30" y="61" text-anchor="start" class="sub">Accelerating recovery of one model can compete with another model’s service latency.</text><rect x="26" y="83" width="414" height="248" rx="13" class="card"/><rect x="460" y="83" width="414" height="248" rx="13" class="card"/><text x="44" y="110" text-anchor="start" class="label">A. Idle or lightly loaded helper</text><text x="478" y="110" text-anchor="start" class="label">B. Busy helper serving inference</text><text x="44" y="150" text-anchor="start" class="mini">Helper GPU</text><text x="44" y="200" text-anchor="start" class="mini">Target GPU</text><text x="44" y="250" text-anchor="start" class="mini">Serving impact</text><text x="478" y="150" text-anchor="start" class="mini">Helper GPU</text><text x="478" y="200" text-anchor="start" class="mini">Target GPU</text><text x="478" y="250" text-anchor="start" class="mini">Serving impact</text><rect x="164" y="131" width="192" height="26" rx="8" class="purple"/><text x="260" y="148" text-anchor="middle" class="white">Relay transfers</text><rect x="164" y="181" width="171" height="26" rx="8" class="green"/><text x="249.5" y="198" text-anchor="middle" class="white">Restoration progresses</text><rect x="164" y="231" width="193" height="26" rx="8" class="greenlight"/><text x="260.5" y="248" text-anchor="middle" class="label">Little contention</text><rect x="601" y="131" width="99" height="26" rx="8" class="purple"/><text x="650.5" y="148" text-anchor="middle" class="white">Relay</text><rect x="701" y="131" width="138" height="26" rx="8" class="green"/><text x="770" y="148" text-anchor="middle" class="white">Inference work</text><rect x="601" y="181" width="145" height="26" rx="8" class="green"/><text x="673.5" y="198" text-anchor="middle" class="white">Restoration</text><rect x="601" y="231" width="238" height="26" rx="8" class="gold"/><text x="720" y="248" text-anchor="middle" class="label">Possible latency interference</text><text x="44" y="301" text-anchor="start" class="mini">Spare resources make relay more attractive.</text><text x="478" y="301" text-anchor="start" class="mini">Shared copy / memory resources raise the tradeoff.</text></svg>