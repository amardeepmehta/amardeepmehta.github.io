<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" role="img" aria-labelledby="title desc"><title id="title">Critical path from H2D transfers to the first token</title><desc id="desc">A conceptual multi-lane timeline with distinct transfer complete, model ready, and first-token milestones.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.heading{font-size:20px;font-weight:700}.sub{font-size:13px;fill:#5b6c77}.label{font-size:13px;font-weight:600}.mini{font-size:11px;fill:#566775}.white{fill:white;font-weight:600;font-size:12px}.card{fill:#ffffff;stroke:#d6e2e9;stroke-width:1.2}.grid{stroke:#dbe4ea;stroke-dasharray:4 5}.blue{fill:#4787b0}.bluelight{fill:#bbd9eb}.green{fill:#4b997e}.greenlight{fill:#cde7dc}.gold{fill:#eac175}.purple{fill:#9274bb}.purplelight{fill:#e7ddf3}.stroke{stroke:#8ba1b0;stroke-width:1.5}.dash{stroke:#607d92;stroke-width:1.5;stroke-dasharray:5 5}.timeline{stroke:#9fb1bc;stroke-width:2}.milestone{fill:#3e5667;font-size:11px;font-weight:700}
</style><rect width="900" height="354" rx="16" fill="#f8fbfd"/><text x="30" y="38" text-anchor="start" class="heading">Restoration is more than copying bytes</text><text x="30" y="60" text-anchor="start" class="sub">Illustrative sequencing; stage durations and overlap depend on the runtime.</text><line x1="192" y1="84" x2="832" y2="84" class="timeline"/><text x="28" y="125" text-anchor="start" class="label">Host runtime</text><text x="28" y="181" text-anchor="start" class="label">H2D transfers</text><text x="28" y="237" text-anchor="start" class="label">Readiness</text><text x="28" y="293" text-anchor="start" class="label">Serving request</text><rect x="196" y="102" width="136" height="31" rx="6" class="purple"/><text x="264" y="121.5" text-anchor="middle" class="white">Allocate / map</text><rect x="340" y="102" width="158" height="31" rx="6" class="purple"/><text x="419" y="121.5" text-anchor="middle" class="white">Bookkeeping</text><rect x="570" y="102" width="109" height="31" rx="6" class="gold"/><text x="624.5" y="121.5" text-anchor="middle" class="label">Sync / events</text><rect x="254" y="158" width="263" height="31" rx="6" class="blue"/><text x="385.5" y="177.5" text-anchor="middle" class="white">Copy groups</text><rect x="525" y="158" width="120" height="31" rx="6" class="bluelight"/><text x="585" y="177.5" text-anchor="middle" class="label">Tail copy</text><rect x="647" y="214" width="90" height="31" rx="6" class="green"/><text x="692" y="233.5" text-anchor="middle" class="white">Ready</text><rect x="739" y="270" width="84" height="31" rx="6" class="green"/><text x="781" y="289.5" text-anchor="middle" class="white">First token</text><line x1="645" y1="143" x2="645" y2="316" class="dash"/><line x1="737" y1="194" x2="737" y2="316" class="dash"/><line x1="823" y1="255" x2="823" y2="316" class="dash"/><text x="645" y="334" text-anchor="middle" class="milestone">H2D done</text><text x="737" y="334" text-anchor="middle" class="milestone">Model ready</text><text x="823" y="334" text-anchor="middle" class="milestone">1st token</text><text x="195" y="90" text-anchor="start" class="mini">Restore request →</text></svg>