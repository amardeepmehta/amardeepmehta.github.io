<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" role="img" aria-labelledby="title desc"><title id="title">Profiling the full recovery interval</title><desc id="desc">A schematic profiler timeline aligns host calls, H2D copies, mapping and synchronization, GPU kernels, and first token.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.heading{font-size:20px;font-weight:700}.sub{font-size:13px;fill:#5b6c77}.label{font-size:13px;font-weight:600}.mini{font-size:11px;fill:#566775}.white{fill:white;font-weight:600;font-size:12px}.card{fill:#ffffff;stroke:#d6e2e9;stroke-width:1.2}.blue{fill:#4787b0}.bluelight{fill:#bbd9eb}.green{fill:#4b997e}.greenlight{fill:#cde7dc}.gold{fill:#eac175}.purple{fill:#9274bb}.purplelight{fill:#e7ddf3}.stroke{stroke:#8ba1b0;stroke-width:1.5}.dash{stroke:#607d92;stroke-width:1.5;stroke-dasharray:5 5}.timeline{stroke:#9fb1bc;stroke-width:2}
</style><rect width="900" height="386" rx="16" fill="#f8fbfd"/><text x="30" y="39" text-anchor="start" class="heading">Measure recovery with a shared, dependency-aware timeline</text><text x="30" y="60" text-anchor="start" class="sub">Inspect where transfer, remapping, synchronization, and request execution actually overlap.</text><text x="30" y="111" text-anchor="start" class="label">CPU API / runtime</text><text x="30" y="161" text-anchor="start" class="label">Copy engines</text><text x="30" y="211" text-anchor="start" class="label">Map / events</text><text x="30" y="261" text-anchor="start" class="label">GPU kernels</text><text x="30" y="311" text-anchor="start" class="label">Client request</text><line x1="187" y1="80" x2="838" y2="80" class="timeline"/><rect x="190" y="93" width="126" height="28" rx="8" class="purple"/><text x="253" y="111" text-anchor="middle" class="white">Launch copies</text><rect x="332" y="93" width="112" height="28" rx="8" class="purple"/><text x="388" y="111" text-anchor="middle" class="white">Submit gaps</text><rect x="478" y="93" width="117" height="28" rx="8" class="purple"/><text x="536.5" y="111" text-anchor="middle" class="white">Wake calls</text><rect x="245" y="143" width="168" height="28" rx="8" class="blue"/><text x="329" y="161" text-anchor="middle" class="white">Copy group A</text><rect x="425" y="143" width="115" height="28" rx="8" class="blue"/><text x="482.5" y="161" text-anchor="middle" class="white">Copy group B</text><rect x="549" y="143" width="92" height="28" rx="8" class="bluelight"/><text x="595" y="161" text-anchor="middle" class="label">Tail copy</text><rect x="460" y="193" width="105" height="28" rx="8" class="gold"/><text x="512.5" y="211" text-anchor="middle" class="label">Events</text><rect x="572" y="193" width="138" height="28" rx="8" class="greenlight"/><text x="641" y="211" text-anchor="middle" class="label">Mappings valid</text><rect x="714" y="243" width="122" height="28" rx="8" class="green"/><text x="775" y="261" text-anchor="middle" class="white">First kernels</text><rect x="781" y="293" width="57" height="28" rx="8" class="green"/><text x="809.5" y="311" text-anchor="middle" class="white">1st tok</text><line x1="641" y1="88" x2="641" y2="335" class="dash"/><line x1="710" y1="88" x2="710" y2="335" class="dash"/><line x1="838" y1="88" x2="838" y2="335" class="dash"/><text x="641" y="352" text-anchor="middle" class="mini">Last H2D</text><text x="710" y="352" text-anchor="middle" class="mini">Model ready</text><text x="838" y="352" text-anchor="middle" class="mini">First token</text><text x="30" y="376" text-anchor="start" class="sub">Measure each interval; do not add stages that overlap.</text></svg>