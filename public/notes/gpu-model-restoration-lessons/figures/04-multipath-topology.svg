<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" role="img" aria-labelledby="title desc"><title id="title">Direct versus relay H2D paths</title><desc id="desc">Host memory copies either directly to the target GPU or through a helper GPU and peer link. Shared resources can constrain both.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.heading{font-size:20px;font-weight:700}.sub{font-size:13px;fill:#5b6c77}.label{font-size:13px;font-weight:600}.mini{font-size:11px;fill:#566775}.white{fill:white;font-weight:600;font-size:12px}.card{fill:#ffffff;stroke:#d6e2e9;stroke-width:1.2}.blue{fill:#4787b0}.bluelight{fill:#bbd9eb}.green{fill:#4b997e}.greenlight{fill:#cde7dc}.gold{fill:#eac175}.purple{fill:#9274bb}.purplelight{fill:#e7ddf3}.stroke{stroke:#8ba1b0;stroke-width:1.5}.dash{stroke:#607d92;stroke-width:1.5;stroke-dasharray:5 5}.timeline{stroke:#9fb1bc;stroke-width:2}
</style><rect width="900" height="346" rx="16" fill="#f8fbfd"/><text x="30" y="39" text-anchor="start" class="heading">Multipath uses another path, not free bandwidth</text><text x="30" y="63" text-anchor="start" class="sub">Direct H2D and a helper-relayed path may overlap, but they can share bottlenecks.</text><rect x="37" y="121" width="194" height="92" rx="13" class="card"/><rect x="655" y="91" width="205" height="90" rx="13" class="card"/><rect x="655" y="228" width="205" height="90" rx="13" class="card"/><text x="134" y="158" text-anchor="middle" class="label">Host memory</text><text x="134" y="182" text-anchor="middle" class="sub">CPU / NUMA domain</text><text x="757" y="129" text-anchor="middle" class="label">Target GPU</text><text x="757" y="150" text-anchor="middle" class="mini">Weights restored here</text><text x="757" y="264" text-anchor="middle" class="label">Helper GPU</text><text x="757" y="286" text-anchor="middle" class="mini">May serve other work</text><path d="M231 144 C 384 120 530 120 655 134" fill="none" stroke="#4787b0" stroke-width="5"/><path d="M640 125 L655 134 L639 141" fill="none" stroke="#4787b0" stroke-width="4"/><text x="422" y="109" text-anchor="middle" class="label">Direct host-to-target transfer</text><path d="M231 186 C 382 216 512 263 655 273" fill="none" stroke="#9274bb" stroke-width="5"/><path d="M640 262 L655 273 L638 280" fill="none" stroke="#9274bb" stroke-width="4"/><text x="427" y="249" text-anchor="middle" class="label">Host-to-helper stage</text><path d="M756 227 L756 183" stroke="#9274bb" stroke-width="5" stroke-dasharray="8 6"/><path d="M748 196 L756 183 L764 196" fill="none" stroke="#9274bb" stroke-width="4"/><text x="790" y="211" text-anchor="start" class="mini">P2P link</text><text x="30" y="326" text-anchor="start" class="sub">Shared constraints: host bandwidth · PCIe / NUMA topology · GPU copy engines · peer-link bandwidth · helper interference</text></svg>