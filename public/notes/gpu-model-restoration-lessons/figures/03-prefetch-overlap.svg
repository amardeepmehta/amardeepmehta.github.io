<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" role="img" aria-labelledby="title desc"><title id="title">Prefetch and exposed communication stalls</title><desc id="desc">A sequential copy-then-compute schedule and a pipelined next-layer prefetch schedule, with stall time highlighted.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.heading{font-size:20px;font-weight:700}.sub{font-size:13px;fill:#5b6c77}.label{font-size:13px;font-weight:600}.mini{font-size:11px;fill:#566775}.white{fill:white;font-weight:600;font-size:12px}.card{fill:#ffffff;stroke:#d6e2e9;stroke-width:1.2}.grid{stroke:#dbe4ea;stroke-dasharray:4 5}.blue{fill:#4787b0}.bluelight{fill:#bbd9eb}.green{fill:#4b997e}.greenlight{fill:#cde7dc}.gold{fill:#eac175}.purple{fill:#9274bb}.purplelight{fill:#e7ddf3}.stroke{stroke:#8ba1b0;stroke-width:1.5}.dash{stroke:#607d92;stroke-width:1.5;stroke-dasharray:5 5}.timeline{stroke:#9fb1bc;stroke-width:2}.milestone{fill:#3e5667;font-size:11px;font-weight:700}
</style><rect width="900" height="375" rx="16" fill="#f8fbfd"/><text x="30" y="38" text-anchor="start" class="heading">Prefetch hides only the transfer that overlaps usable work</text><text x="30" y="62" text-anchor="start" class="sub">Blue = H2D copy  •  Green = compute  •  Amber = exposed stall</text><text x="30" y="101" text-anchor="start" class="label">Without prefetch</text><text x="30" y="139" text-anchor="start" class="mini">Copy engine</text><text x="30" y="177" text-anchor="start" class="mini">Compute</text><rect x="178" y="119" width="106" height="26" rx="6" class="blue"/><text x="231" y="136" text-anchor="middle" class="white">Copy L0</text><rect x="286" y="157" width="76" height="26" rx="6" class="green"/><text x="324" y="174" text-anchor="middle" class="white">Run L0</text><rect x="364" y="119" width="118" height="26" rx="6" class="blue"/><text x="423" y="136" text-anchor="middle" class="white">Copy L1</text><rect x="484" y="157" width="78" height="26" rx="6" class="green"/><text x="523" y="174" text-anchor="middle" class="white">Run L1</text><rect x="564" y="119" width="115" height="26" rx="6" class="blue"/><text x="621.5" y="136" text-anchor="middle" class="white">Copy L2</text><rect x="681" y="157" width="80" height="26" rx="6" class="green"/><text x="721" y="174" text-anchor="middle" class="white">Run L2</text><line x1="178" y1="191" x2="824" y2="191" class="timeline"/><text x="30" y="228" text-anchor="start" class="label">With next-layer prefetch</text><text x="30" y="267" text-anchor="start" class="mini">Copy engine</text><text x="30" y="306" text-anchor="start" class="mini">Compute / wait</text><rect x="178" y="246" width="106" height="26" rx="6" class="blue"/><text x="231" y="263" text-anchor="middle" class="white">Copy L0</text><rect x="284" y="285" width="76" height="26" rx="6" class="green"/><text x="322" y="302" text-anchor="middle" class="white">Run L0</text><rect x="284" y="246" width="116" height="26" rx="6" class="blue"/><text x="342" y="263" text-anchor="middle" class="white">Prefetch L1</text><rect x="360" y="285" width="40" height="26" rx="6" class="gold"/><text x="380" y="302" text-anchor="middle" class="label">Wait</text><rect x="400" y="285" width="93" height="26" rx="6" class="green"/><text x="446.5" y="302" text-anchor="middle" class="white">Run L1</text><rect x="400" y="246" width="86" height="26" rx="6" class="blue"/><text x="443" y="263" text-anchor="middle" class="white">Prefetch L2</text><rect x="493" y="285" width="89" height="26" rx="6" class="green"/><text x="537.5" y="302" text-anchor="middle" class="white">Run L2</text><line x1="178" y1="320" x2="824" y2="320" class="timeline"/><text x="30" y="357" text-anchor="start" class="sub">L1 finishes copying after L0 compute, so 40 schematic time-units remain exposed as a stall.</text></svg>