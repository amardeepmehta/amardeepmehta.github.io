<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 358" role="img" aria-labelledby="title desc"><title id="title">Tensor merging tradeoff</title><desc id="desc">Many small copy operations and coalesced groups use similar bytes but expose different launch overhead and readiness granularity.</desc><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.heading{font-size:20px;font-weight:700}.sub{font-size:13px;fill:#5b6c77}.label{font-size:13px;font-weight:600}.mini{font-size:11px;fill:#566775}.white{fill:white;font-weight:600;font-size:12px}.card{fill:#ffffff;stroke:#d6e2e9;stroke-width:1.2}.grid{stroke:#dbe4ea;stroke-dasharray:4 5}.blue{fill:#4787b0}.bluelight{fill:#bbd9eb}.green{fill:#4b997e}.greenlight{fill:#cde7dc}.gold{fill:#eac175}.purple{fill:#9274bb}.purplelight{fill:#e7ddf3}.stroke{stroke:#8ba1b0;stroke-width:1.5}.dash{stroke:#607d92;stroke-width:1.5;stroke-dasharray:5 5}.timeline{stroke:#9fb1bc;stroke-width:2}.milestone{fill:#3e5667;font-size:11px;font-weight:700}
</style><rect width="900" height="358" rx="16" fill="#f8fbfd"/><text x="30" y="39" text-anchor="start" class="heading">Tensor merging: fewer calls, coarser readiness</text><text x="30" y="61" text-anchor="start" class="sub">The amount of data can remain the same even when the copy granularity changes.</text><rect x="29" y="80" width="405" height="232" rx="12" class="card"/><rect x="465" y="80" width="405" height="232" rx="12" class="card"/><text x="50" y="108" text-anchor="start" class="label">A. Fragmented transfers</text><text x="486" y="108" text-anchor="start" class="label">B. Merged transfers</text><text x="50" y="137" text-anchor="start" class="mini">Transfer operations</text><text x="486" y="137" text-anchor="start" class="mini">Transfer operations</text><rect x="50" y="150" width="25" height="28" rx="6" class="blue"/><rect x="84" y="150" width="25" height="28" rx="6" class="bluelight"/><rect x="118" y="150" width="25" height="28" rx="6" class="purple"/><rect x="152" y="150" width="25" height="28" rx="6" class="blue"/><rect x="186" y="150" width="25" height="28" rx="6" class="bluelight"/><rect x="220" y="150" width="25" height="28" rx="6" class="purple"/><rect x="254" y="150" width="25" height="28" rx="6" class="blue"/><rect x="288" y="150" width="25" height="28" rx="6" class="bluelight"/><rect x="322" y="150" width="25" height="28" rx="6" class="purple"/><rect x="356" y="150" width="25" height="28" rx="6" class="blue"/><rect x="486" y="150" width="104" height="28" rx="6" class="blue"/><rect x="598" y="150" width="104" height="28" rx="6" class="bluelight"/><rect x="710" y="150" width="104" height="28" rx="6" class="purple"/><text x="50" y="213" text-anchor="start" class="mini">Readiness can be observed by smaller units</text><text x="486" y="213" text-anchor="start" class="mini">Ready only when the required merged unit completes</text><rect x="50" y="229" width="88" height="26" rx="6" class="green"/><text x="94" y="246" text-anchor="middle" class="white">Layer 0</text><rect x="147" y="229" width="88" height="26" rx="6" class="green"/><text x="191" y="246" text-anchor="middle" class="white">Layer 1</text><rect x="244" y="229" width="88" height="26" rx="6" class="green"/><text x="288" y="246" text-anchor="middle" class="white">Layer 2</text><rect x="486" y="229" width="210" height="26" rx="6" class="gold"/><text x="591" y="246" text-anchor="middle" class="label">Pending merged unit</text><rect x="704" y="229" width="140" height="26" rx="6" class="green"/><text x="774" y="246" text-anchor="middle" class="white">Ready together</text><text x="50" y="287" text-anchor="start" class="mini">Tradeoff: more submissions, earlier partial readiness</text><text x="486" y="287" text-anchor="start" class="mini">Tradeoff: fewer submissions, larger wait units</text><text x="30" y="340" text-anchor="start" class="sub">These units are schematic; legal merging also depends on address layout, alignment, and tensor lifetime.</text></svg>